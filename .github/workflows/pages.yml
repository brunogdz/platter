name: Publish vanilla preview

on:
  push:
    branches: [main]
    paths: ['vanilla/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vanilla/package-lock.json
      - run: npm ci
        working-directory: vanilla
      - run: npm run build
        working-directory: vanilla
      - name: Stage public files only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platter-site"
          cp vanilla/index.html "$RUNNER_TEMP/platter-site/"
          cp -R vanilla/assets "$RUNNER_TEMP/platter-site/assets"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/platter-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
